name: CI

# The gate every PR must pass. The build step is the same OpenNext build the
# Deploy workflow ships, so anything that cannot deploy fails here, on the PR.
# Needs no Cloudflare credentials.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (Next.js + OpenNext bundle for Cloudflare Workers)
        run: npx opennextjs-cloudflare build
